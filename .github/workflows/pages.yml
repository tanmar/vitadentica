# Podgląd (staging) na GitHub Pages: https://tanmar.github.io/vitadentica/
# Build stagingowy daje noindex i `Disallow: /`; adresy od korzenia są przepisane na podścieżkę (scripts/pages-base.mjs).
# Produkcja (vitadentica.pl na Cloudflare Pages) buduje się bez tych kroków.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: SITE_ENV=staging STAGING_URL=https://tanmar.github.io npm run build
      - run: npm run verify
      - run: node scripts/pages-base.mjs /vitadentica
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
